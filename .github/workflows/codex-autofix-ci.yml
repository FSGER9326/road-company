name: Codex Autofix CI

on:
  workflow_run:
    workflows: ["Road Company CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      notes:
        description: 'Optional manual repair notes'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  codex_autofix:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Codex CI repair
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          safety-strategy: drop-sudo
          prompt: |
            Read .github/codex/prompts/autofix-ci.md and follow it.

            CI failed or manual CI repair was requested.
            Workflow run URL: ${{ github.event.workflow_run.html_url || 'manual dispatch' }}
            Manual notes: ${{ github.event.inputs.notes || '' }}

            Inspect the repository, run tests, identify the failure, and make the smallest safe fix.

      - name: Create CI repair pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: codex/autofix-ci-${{ github.run_id }}
          title: "Codex: autofix CI failure"
          body: |
            Automated Codex CI repair.

            ## Codex result

            ${{ steps.codex.outputs.final-message }}
          commit-message: "Codex autofix CI failure"
          labels: codex:generated,codex:autofix
