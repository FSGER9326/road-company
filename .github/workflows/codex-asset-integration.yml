name: Codex Asset Integration

on:
  push:
    branches: [main]
    paths:
      - 'assets/generated/**'
      - 'assets/manifests/**'
  workflow_dispatch:
    inputs:
      notes:
        description: 'Optional notes about assets to integrate'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  codex_asset_integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Codex asset integration pass
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          safety-strategy: drop-sudo
          prompt: |
            Read AGENTS.md and docs/ASSET_PIPELINE.md.

            New or changed assets/manifests may need integration.
            Manual notes: ${{ github.event.inputs.notes || '' }}

            Inspect assets under assets/generated/ and manifests under assets/manifests/.
            If integration work is needed, update registries/import metadata/docs/tests as appropriate.
            If no integration work is needed, make no code changes and explain why.

      - name: Create asset integration pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: codex/asset-integration-${{ github.run_id }}
          title: "Codex: integrate generated assets"
          body: |
            Automated generated-asset integration pass.

            ## Codex result

            ${{ steps.codex.outputs.final-message }}
          commit-message: "Codex integrate generated assets"
          labels: codex:generated,needs:asset
